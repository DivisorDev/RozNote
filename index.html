<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Roz Ka Hisab Kitab - M Qasim’s Divisor Studio</title>
  <style>
    body { font-family: 'Segoe UI',Arial,sans-serif; background:linear-gradient(135deg,#eff7ff 0,#b2ceea 100%); margin:0;}
    .main {max-width:430px;margin:20px auto 0; padding:0 0 18px 0; background:#fff;border-radius:17px;box-shadow:0 7px 24px #a5cfff3b;}
    h2 {margin:0; padding:19px 0 8px 0; text-align:center;color:#2270b8;}
    table {width:100%; border-collapse:collapse;}
    th, td {font-size:1em; border:0; text-align:center;}
    th {background:#e0f1fb; color:#2886e3;}
    td {background:#f7fbfd;}
    input[type="date"],input[type="text"],input[type="number"] {width:96%;font-size:.92em;border:1px solid #b8d0fc;background:#f7fafb;padding:6px 4px;margin-bottom:2px;border-radius:6px;}
    .pager {text-align:right; padding: 6px 15px;}
    .pager button {padding:5px 13px;border-radius:7px;background:#2588d8;color:#fff;border:none;font-size:1em;margin-left:7px;}
    .pager .active {background:#19a7ce;}
    .actions-bar {display:flex;justify-content:center;gap:14px;margin:13px 0 3px 0;}
    .actions-bar button {padding:7px 13px;border-radius:7px;border:none;font-weight:500;font-size:1em;}
    .pdfw {background:#1e87fa; color:#fff;}
    .wa {background:#24d366;color:#fff;}
    .erase {background:#fb5d3c;color:#fff;}
    .branding {text-align:center;color:#8da4bb;font-size:0.96em;margin:15px 0 5px 0;}
    @media (max-width:500px) {th,td{font-size:.9em;}}
  </style>
</head>
<body>
  <div class="main">
    <h2>Roz Ka Hisab Kitab</h2>
    <div id="tableWrap"></div>
    <div class="pager" id="pager"></div>
    <div class="actions-bar">
      <button class="pdfw" onclick="downloadPDF()">PDF Download</button>
      <button class="wa" onclick="shareWA()">Share WhatsApp</button>
      <button class="erase" onclick="confirmErase()">Erase All</button>
    </div>
    <div class="branding">© 2025 M Qasim’s Divisor Studio</div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    const ROWS_PER_PAGE = 10;
    let pages = JSON.parse(localStorage.getItem('ledgerPages')||'[]') || [[]];
    let curPage = 0;
    function renderTable() {
      let page = pages[curPage] || [];
      let tbl = `<table><tr>
        <th>Date</th><th>Input</th><th>Output</th><th>Expenses</th><th>Amount</th></tr>`;
      for(let i=0;i<ROWS_PER_PAGE;i++) {
        const entry = page[i]||{};
        tbl += `<tr>
          <td><input type="date" value="${entry.date||''}" onchange="saveCell(${i},'date',this.value)"></td>
          <td><input type="text" value="${entry.input||''}" onchange="saveCell(${i},'input',this.value)" placeholder="Input source"></td>
          <td><input type="text" value="${entry.output||''}" onchange="saveCell(${i},'output',this.value)" placeholder="Output desc"></td>
          <td><input type="text" value="${entry.expense||''}" onchange="saveCell(${i},'expense',this.value)" placeholder="Expense"></td>
          <td><input type="number" value="${entry.amount||''}" onchange="saveCell(${i},'amount',this.value)" min="0"></td>
        </tr>`;
      }
      tbl += `</table>`;
      document.getElementById('tableWrap').innerHTML = tbl;
      renderPager();
    }
    function saveCell(idx, key, val){
      if(!pages[curPage]) pages[curPage]=[];
      if(!pages[curPage][idx]) pages[curPage][idx]={};
      pages[curPage][idx][key]=val;
      // If last line has data, auto add page
      if(curPage==pages.length-1 && idx==ROWS_PER_PAGE-1 && val && key!=''){
        pages.push([]);
        curPage++;
        renderTable();
      }
      localStorage.setItem('ledgerPages',JSON.stringify(pages));
    }
    function renderPager(){
      let html='';
      for(let i=0;i<pages.length;i++)
        html+= `<button class="${i==curPage?'active':''}" onclick="gopage(${i})">Page ${i+1}</button>`;
      document.getElementById('pager').innerHTML=html;
    }
    function gopage(i){ curPage=i; renderTable(); }
    function downloadPDF(){
      import('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js').then(jsPDF=>{
        let doc=new jsPDF.jsPDF();
        for(let p=0;p<pages.length;p++){
          if(p>0) doc.addPage();
          doc.setFontSize(14); doc.text(`Roz Ka Hisab Kitab\nPage ${p+1}`,20,18);
          let y=32;
          doc.setFontSize(12);
          doc.text("Date  Input  Output  Expense  Amount",15,y);
          y+=10;
          for(let r=0;r<ROWS_PER_PAGE;r++){
            let row = pages[p][r]||{};
            let line = `${row.date||''}   ${row.input||''}    ${row.output||''}    ${row.expense||''}    ₹${row.amount||''}`;
            doc.text(line,15,y); y+=10;
          }
          doc.text('© 2025 M Qasim’s Divisor Studio',15,285);
        }
        doc.save('Roz-Ka-Hisab-Kitab.pdf');
      });
    }
    function shareWA(){
      let txt = '';
      for(let p=0;p<pages.length;p++){
        txt += `Page ${p+1}\n---------\n`;
        for(let r=0;r<ROWS_PER_PAGE;r++){
          let row=pages[p][r]||{};
          if(row.date||row.input||row.output||row.expense||row.amount)
            txt += `${row.date||''}|${row.input||''}|${row.output||''}|${row.expense||''}|₹${row.amount||''}\n`;
        }
      }
      txt += '© 2025 M Qasim’s Divisor Studio';
      let waurl = 'https://wa.me/?text=' + encodeURIComponent(txt);
      window.open(waurl,'_blank');
    }
    function confirmErase(){
      if(confirm('Sab data erase ho jayega, sure?')){
        pages=[[]];curPage=0;localStorage.removeItem('ledgerPages');renderTable();
      }
    }
    renderTable();
  </script>
</body>
</html>
